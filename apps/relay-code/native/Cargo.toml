# Relay Code: Relay's phone app for coding, in Rust drawn with wgpu (Relay design 44). Its own
# workspace with its own Cargo.lock, not a member of the root one, as Leaf and Tally RS are.
[workspace]
resolver = "2"
members = ["crates/rc-link", "crates/relay-code"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
