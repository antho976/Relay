[package]
name = "relay-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Relay native desktop: GTK4, VTE and GtkSourceView over the Relay engine"

[dependencies]
relay-bus = { workspace = true }
relay-board = { workspace = true }
relay-client = { workspace = true }
relay-money = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
gtk4 = { version = "0.11.4", features = ["v4_22"] }
libc.workspace = true
glib = "0.22.9"
cairo-rs = { version = "0.22.9", features = ["svg", "pdf", "v1_16"] }
pango = { version = "0.22.9", features = ["v1_56"] }
async-channel = "2.5.0"
vte4 = { version = "0.10.0", features = ["v0_84"] }
sourceview5 = { version = "0.11.2", features = ["v5_18"] }
# The device mirror's H.264 decoder: libavcodec's types and constants, bound by bindgen against
# the installed headers. The library itself is opened at run time (`mirror/avcodec.rs`), so a
# machine without it still runs everything but the mirror.
ffmpeg-sys-next = { version = "=9.0.1", default-features = false, features = ["avcodec"] }
