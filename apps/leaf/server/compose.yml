# Leaf's server: Suwayomi (runs the Mihon extensions, downloads chapters, converts them to WebP)
# and leaf-server (the autopilot, and the only door the phone uses).
#
# On the home server (server1) it sits beside the bot (~/apps/discord-bot): no port is published.
# leaf-server joins the bot's network, and the bot's Caddy sends https://anthobot.bid/leaf/* to it
# (deploy/Caddyfile in antho976/Discord-bot-V2), behind the Cloudflare Tunnel already there.
#
#   cd ~/apps/leaf/server && cp env.example .env   # then set LEAF_TOKEN; chmod 600 .env
#   mkdir -p data/leaf   # yours, not root's: leaf-server runs as uid 1000 and writes leaf.db there
#   docker compose up -d --build
#
# The images are pinned (what `stable` and `latest` were on 2026-11-22): an upgrade is a change
# made here and tried, not one pulled in by a restart.
name: leaf

services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2373-stable
    restart: unless-stopped
    environment:
      # Suwayomi ships no sources: the community list Mihon uses.
      - 'EXTENSION_REPOS=["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]'
    volumes:
      # Downloads first: the image's own instructions say it must be listed before the data.
      - ./data/downloads:/home/suwayomi/.local/share/Tachidesk/downloads
      - ./data/suwayomi:/home/suwayomi/.local/share/Tachidesk

  # Passes the Cloudflare checks some sources put in front of their pages (Suwayomi asks it).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped

  leaf-server:
    build:
      context: ../native
      dockerfile: crates/leaf-server/Dockerfile
    image: leaf-server:local
    restart: unless-stopped
    depends_on: [suwayomi, flaresolverr]
    environment:
      - SUWAYOMI_URL=http://suwayomi:4567
      - LEAF_FLARESOLVERR=http://flaresolverr:8191
      - LEAF_DOWNLOADS=/downloads/mangas
      - LEAF_TOKEN=${LEAF_TOKEN:?set LEAF_TOKEN in .env}
      - LEAF_SOURCES=${LEAF_SOURCES:-Asura Scans,Flame Comics,Drake Scans,Rizz Comic,MangaDex,Weeb Central,MangaFire,ManhuaUS,Webtoons.com}
      # Background requests' spacing per source ("3000,MangaDex=1500"), and the sources searched to
      # tell whether a recommendation can be read; empty keeps leaf-server's defaults (main.rs).
      - LEAF_SOURCE_GAP_MS=${LEAF_SOURCE_GAP_MS:-}
      - LEAF_REC_SOURCES=${LEAF_REC_SOURCES:-}
    volumes:
      - ./data/leaf:/data
      # Suwayomi's downloads, so chapter pages (mangas/, not the covers in thumbnails/) can be
      # re-encoded smaller (squeeze.rs) and chapter pictures cut from them (thumbs.rs).
      - ./data/downloads:/downloads
    networks:
      default: {}
      bot:
        aliases: [leaf-server]

networks:
  # The bot's compose network, so its Caddy reaches leaf-server by name.
  bot:
    name: discord-bot_default
    external: true
