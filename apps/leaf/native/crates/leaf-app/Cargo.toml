[package]
name = "leaf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leaf, the phone app: comics from leaf-server, drawn with wgpu (Tally RS's renderer), for Android and the desktop."

[lib]
name = "leaf"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "leaf"
path = "src/main.rs"

[dependencies]
leaf-proto = { path = "../leaf-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
zeno = "0.3"
# Icon paths go through svgtypes first: zeno's own parser stops early on some compact arcs.
svgtypes = "0.16"
# Pages come as WebP, sometimes JPEG or PNG; covers the same.
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
pollster = "0.4"
# The server, over HTTP or HTTPS. Pure-Rust TLS with ring and Mozilla's roots, as Tally RS, so the
# Android build needs no cmake or NASM.
ureq = { version = "3", default-features = false, features = ["rustls"] }
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = "0.30"
png = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["game-activity"] }
ndk = "0.9"
jni = "0.21"
libc = "0.2"
