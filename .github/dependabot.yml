# The workflows pin every action to a commit (ci.yml), which no tag move can change and nothing
# updates either. Once a month, one grouped pull request proposes the new commits, security
# fixes included; CI runs on it like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Crates: a weekly look at both locked trees (the workspace and the key proxy's own), so a
  # RustSec fix arrives as a pull request instead of a red weekly Dependencies run. Security
  # fixes come grouped in one PR, patch releases in another; a minor or major bump comes on its
  # own, at most five open at once.
  - package-ecosystem: cargo
    directories: ["/", "/crates/relay-key-proxy"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      crates:
        update-types: ["patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
