name: CI

# Every push to main and every pull request: the headless crates on Ubuntu, and the GTK desktop
# client in an Arch Linux container. The phone app has its own workflow, relay-android.yml, which
# runs only when it changes; relay-server-image.yml calls this one before it publishes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push to a pull request supersedes its running check; a push to main does not, so
# every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository. Actions are pinned to commits, with the tag they
# were resolved from beside them, so a moved tag or branch cannot change what runs; Dependabot
# proposes the bumps (.github/dependabot.yml).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug-info test binaries fill the runner's disk; line tables keep a panic's file and line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  engine:
    name: engine, bus and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The image ships toolchains this job never uses; dropping them frees about 20 GB.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned rather than `stable`, so a Rust release cannot turn the build red on its own; and
      # pinned to what the developer machine runs, since a lint one version reports and another
      # does not is how main went red from #103 to #110. Bump it with `rust-version` (Cargo.toml)
      # and the image in deploy/rendezvous.Dockerfile, in a commit of its own.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master when pinned; no tag names it (v1 is 683b588c, PR #114)
        with:
          toolchain: "1.99"
          components: clippy

      # Saved from main only: a pull request restores main's cache, and its own would only
      # crowd main's out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `--locked` fails if Cargo.lock would have to change; `--no-fail-fast` reports every
      # failing crate in one run instead of stopping at the first.
      - name: Test
        run: cargo test --locked --no-fail-fast

      # What one `cargo test` links, against a checked-in budget (docs/perf/FIXES-2026-10-18.md).
      - name: Test executable size
        if: ${{ !cancelled() }}
        run: python3 scripts/perf/test-exe-size.py --locked

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings

      # The API-key proxy is its own workspace (docs/KEY-PROXY.md), outside the default members.
      - name: Key proxy
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --manifest-path crates/relay-key-proxy/Cargo.toml
          cargo clippy --locked --manifest-path crates/relay-key-proxy/Cargo.toml --all-targets -- -D warnings

      # run.sh against a fake cargo, engine and client: no GTK, no display, nothing installed.
      - name: Launcher
        if: ${{ !cancelled() }}
        run: python3 scripts/test-launcher.py

      # streamclips.py (plugins/video/runtime/clips): stdlib only; the loudness test skips without ffmpeg.
      - name: Stream clips
        if: ${{ !cancelled() }}
        run: python3 scripts/test-streamclips.py

  native:
    name: native client (GTK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # relay-native pins GTK 4.22, VTE 0.84, GtkSourceView 5.18 and pango 1.56, which Ubuntu does
    # not carry. Arch does, as the developer machine (CachyOS) does; its tests need no display.
    container: archlinux:base-devel
    steps:
      - name: GTK, VTE, GtkSourceView, FFmpeg headers and libclang
        run: pacman -Syu --noconfirm --needed git gtk4 vte4 gtksourceview5 ffmpeg clang

      # The image and its packages float (a rolling distribution): the versions this run built
      # against are in its log, beside the ones CLAUDE.md pins, for when a failure is Arch's.
      - name: The GTK stack this run builds against
        run: pacman -Q gtk4 vte4 gtksourceview5 pango glib2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master when pinned; no tag names it (v1 is 683b588c, PR #114)
        with:
          toolchain: "1.99"
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # gtk-rs marks APIs deprecated a release before GTK drops them; those are read, not gated.
      - name: Clippy
        run: cargo clippy --locked -p relay-native --all-targets -- -D warnings -A deprecated

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked -p relay-native

# `cargo fmt --check` is absent on purpose: the workspace is not rustfmt-clean, deliberately in
# places, and enforcing it would be a reformat of the repository (CLAUDE.md).
