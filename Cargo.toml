[workspace]
resolver = "2"
members = ["crates/relay-bus", "crates/relay-core", "crates/relay-cli", "crates/relay-remote", "crates/relay-board", "crates/relay-client", "crates/relay-money", "crates/relay-arbiter", "crates/relay-gym", "apps/relay-native"]
# Engine checks stay headless; build the GTK client with `-p relay-native`. relay-board and
# relay-client are the client's GTK-free logic (the board; the Git panel and the device mirror),
# here so plain `cargo test` (and CI) runs their tests. relay-money is Tally's money rules;
# relay-arbiter is Arbiter's trading rules; relay-gym reads Avex's training history.
default-members = ["crates/relay-bus", "crates/relay-core", "crates/relay-cli", "crates/relay-remote", "crates/relay-board", "crates/relay-client", "crates/relay-money", "crates/relay-arbiter", "crates/relay-gym"]

[workspace.package]
version = "4.0.0-dev"
edition = "2021"
license = "UNLICENSED"
publish = false
# The toolchain CI builds with (.github/workflows/ci.yml); bump both together. Clippy's
# incompatible_msrv then flags a std API newer than this on a newer local toolchain, for every
# member that inherits it (`rust-version.workspace = true`).
rust-version = "1.99"

[workspace.dependencies]
relay-bus = { path = "crates/relay-bus" }
relay-core = { path = "crates/relay-core" }
relay-remote = { path = "crates/relay-remote" }
relay-board = { path = "crates/relay-board" }
relay-client = { path = "crates/relay-client" }
relay-money = { path = "crates/relay-money", default-features = false }
relay-arbiter = { path = "crates/relay-arbiter", default-features = false }
relay-gym = { path = "crates/relay-gym", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "1", features = ["uuid1", "preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sha2 = "0.11"
jiff = { version = "0.2", features = ["serde"] }
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rand = "0.9"
portable-pty = "0.9"
base64 = "0.23"
# gix's defaults also build blame, archive, worktree streams, mailmap and credentials, none of
# which relay-core calls. These are the defaults minus those (and minus `interrupt`, whose signal
# handlers are never installed here).
gix = { version = "0.86", default-features = false, features = ["status", "worktree-mutation", "revision", "revparse-regex", "sha1", "max-performance-safe", "comfort", "auto-chain-error"] }
which = "8"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-svelte = { package = "tree-sitter-svelte-next", version = "0.1" }
tree-sitter-kotlin = { package = "tree-sitter-kotlin-ng", version = "1.1" }
notify = "8"
regex = "1"
similar = "2"

# `run.sh` launches `target/debug`, so the dev profile is the one the application actually runs
# in. Unoptimized dependencies are what that costs: SQLite, base64, serde, regex, tree-sitter and
# the GTK stack all sit on the hot paths, and an `-O0` `sqlite3.c` or byte-at-a-time ring copy is
# the difference between a responsive terminal wall and a sluggish one. Dependencies are built
# once and cached, so paying full optimization for them is nearly free; workspace crates stay at
# `opt-level = 1`, which removes the worst of the debug-build overhead while keeping incremental
# rebuilds quick. Debug assertions, overflow checks and debug info are all unchanged.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Cross-crate inlining matters here: the bus, the engine and the client are separate crates on
# one request path, and the generic serde/rusqlite/gix code they call cannot be inlined across
# the boundary without LTO. Release builds are rare enough to afford it.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
