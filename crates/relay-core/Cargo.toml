[package]
name = "relay-core"
description = "RELAY v4 engine: store, audit, pipeline, socket door. Headless; zero GUI deps."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are listed below: most are one executable, tests/all.rs.
autotests = false

[dependencies]
relay-bus.workspace = true
# design.apply's contrast flags: the canvas's layout and checks, GTK-free.
relay-client.workspace = true
relay-money = { workspace = true, features = ["ledger"] }
relay-arbiter = { workspace = true, features = ["engine"] }
relay-gym = { workspace = true, features = ["store"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
rusqlite.workspace = true
sha2.workspace = true
jiff.workspace = true
directories.workspace = true
libc.workspace = true
rand.workspace = true
portable-pty.workspace = true
base64.workspace = true
gix.workspace = true
which.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-svelte.workspace = true
tree-sitter-kotlin.workspace = true
notify.workspace = true
regex.workspace = true
similar.workspace = true
tempfile = "3"
# The Pictures plugin's client for its fixed hosts (pictures-core), as relay-remote's.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# video.still: reading the frames it draws (contrast) and laying several out as one sheet.
png = "0.18"

# The native client's headless half: tests/native_input.rs sends its mirror payload builders.
[dev-dependencies]
ctor = "1"

# Most of tests/ links as one executable (tests/all.rs). These files change process-wide state
# (`set_var`, `set_current_dir`), so each keeps an executable of its own.
[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "integration_registry"
path = "tests/integration_registry.rs"

[[test]]
name = "money"
path = "tests/money.rs"

[[test]]
name = "phase12"
path = "tests/phase12.rs"

[[test]]
name = "store"
path = "tests/store.rs"

[[test]]
name = "task_edges"
path = "tests/task_edges.rs"

[[test]]
name = "transcript"
path = "tests/transcript.rs"

[[test]]
name = "usage_source"
path = "tests/usage_source.rs"
