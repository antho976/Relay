[package]
name = "relay-cli"
description = "`relay` — the CLI door of the RELAY v4 bus (BUS.md §8)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
relay-bus.workspace = true
relay-core.workspace = true
relay-remote.workspace = true
relay-money.workspace = true
jiff.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
regex.workspace = true
serde.workspace = true
# `relay key-proxy` (key_proxy.rs): HTTPS to api.anthropic.com with the roots built in, so a
# certificate added to the system store cannot read the key in flight. One crypto provider, as
# relay-remote's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
httparse = "1"

[dev-dependencies]
tempfile = "3"
