[package]
name = "relay-remote"
description = "Relay's remote door: the bus over WebSocket for a paired phone, on the LAN or through a self-hosted rendezvous server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
relay-bus.workspace = true
relay-core.workspace = true
# `Change` and `SyncOut`, the shape of `money.sync`, for the PC's cloud link (cloud.rs).
relay-money = { workspace = true, features = ["ledger"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
sha2.workspace = true
rand.workspace = true
jiff.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# tokio-tungstenite builds rustls with no crypto provider, and `ClientConfig::builder()` panics
# without one. Exactly one provider feature: enabling a second makes the choice ambiguous again.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.15"

[dev-dependencies]
tempfile = "3"
# Decodes the base64 `pty` frames a phone receives.
base64.workspace = true
