[package]
name = "relay-aide"
description = "Aide, Relay's personal agent (docs/AIDE.md): its jobs, schedules, data rules, privacy tiers and approval policy, and the SQLite file (`aide.db`) that keeps them, behind the `store` feature."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jiff.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
default = ["store"]
# The SQLite file (`aide.db`). Off for crates that only need the aide.* contract (relay-bus).
store = ["dep:rusqlite"]
