[package]
name = "relay-key-proxy"
description = "Holds the Anthropic API key for Relay's API-key sessions, as its own system user (docs/KEY-PROXY.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Kept small: root builds this from a clean clone (scripts/key-proxy/install.sh), and the installer
# shows the whole dependency tree before it does.
[dependencies]
tokio.workspace = true
# prctl(PR_SET_DUMPABLE); already in the tree through tokio.
libc = "0.2"
# HTTPS to api.anthropic.com with the roots built in, so a certificate added to the system store
# cannot read the key in flight. One crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
httparse = "1"
